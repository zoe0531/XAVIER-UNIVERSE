<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星宙</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sky">

<div id="gate">
  <div class="mark">xavier / 1016</div>
  <div class="label">进 入 宇 宙</div>
  <input id="pw" type="tel" inputmode="numeric" maxlength="8" placeholder="····" autocomplete="off">
  <div class="err" id="gerr">不对，再试一次</div>
</div>

<div id="hud">
  <div id="exitBtn" title="退出到星球"><svg viewBox="0 0 20 20"><polyline points="12.5,4.5 6.5,10 12.5,15.5"/></svg></div>
  <div id="count"></div>
  <div id="btns">
    <div class="round" id="reshuffle">换 一 批 ★</div>
    <div class="round big" id="add">＋</div>
    <div class="round" id="mineBtn">我 的</div>
  </div>
  <div id="setting">⚙</div>
  <div id="immerse" title="沉浸式观赏">★</div>
  <div id="searchBtn"><svg viewBox="0 0 20 20"><circle cx="8.6" cy="8.6" r="5.6"/><line x1="12.8" y1="12.8" x2="18" y2="18"/></svg></div>
</div>

<div id="empty">
  <div class="s">✦</div>
</div>

<div id="card">
  <div class="orb"><span class="ball"></span><span class="ring"></span></div>
  <div class="by"><span id="cBy">— 星 宙 —</span></div>
  <div class="txt" id="cTxt"></div>
  <img id="cImg" alt="">
  <div class="meta" id="cMeta"></div>
  <div class="close" id="cClose">收 起</div>
</div>

<div id="sheet">
  <div id="box">
    <textarea id="wText"></textarea>
    <div class="row">
      <input id="wBy" maxlength="12" placeholder="写 你 的 名 字" autocomplete="off"
       autocapitalize="off" autocorrect="off" spellcheck="false" name="xz-by-new">
      <button class="btn" id="wSend">放 进 星 宙</button>
    </div>
    <div id="photoRow">
      <div id="photoPrev"></div>
      <button type="button" class="photoBtn" id="photoPick">选 图</button>
      <button type="button" class="photoBtn" id="photoPaste">粘 贴</button>
      <span id="photoDel">移除</span>
    </div>
    <input type="file" id="wPhoto" accept="image/*" hidden>
    <div class="tip"><span id="wClear">清 空</span><span id="wFold">收 起</span></div>
  </div>
</div>

<!-- 管理：入口只有一个极淡的小齿轮，且要过密码，删除动作不产生任何全局提示 -->
<div id="adminGate">
  <div class="h">管 理</div>
  <input id="adPw" type="password" placeholder="······" autocomplete="off">
  <div class="err" id="adErr">不对</div>
  <div class="foot"><span id="adCancel">取 消</span><span id="adEnter">进 入</span></div>
</div>

<div id="searchPanel">
  <div class="line">
    <input id="searchNo" type="text" placeholder="第 几 颗 / 名 字" autocomplete="off">
    <span class="act" id="searchGo"><i>★</i>搜 索</span>
  </div>
  <div class="foot"><span id="allOpen">看 全 部</span><span id="searchClose">关 闭</span></div>
</div>

<div id="allPanel">
  <div class="h" id="allHead">全 部 祝 福</div>
  <div class="n" id="allNum"></div>
  <div id="allList"></div>
  <div class="foot"><span id="allClose">关 闭</span></div>
</div>

<div id="minePanel">
  <div class="h">我 的 星 星</div>
  <div class="n" id="mineNum"></div>
  <div id="mineList"></div>
  <div class="foot"><span id="mineClose">关 闭</span></div>
</div>

<div id="admin">
  <div class="h">删 除 祝 福</div>
  <div class="line">
    <input id="delNo" type="tel" inputmode="numeric" placeholder="第几颗">
    <span class="act" id="delBtn">删 除</span>
  </div>
  <div class="prev" id="delPrev"></div>
  <div class="foot"><span id="adClose">关 闭</span></div>
</div>

<div id="toast"></div>
<div id="photoView"><img id="pvImg" alt=""></div>

</div><!-- /#sky -->

<div id="planet">
  <canvas id="pc"></canvas>
  <div class="hint">轻 触 星 球 · 进 入 星 宙</div>
  <div class="sub">XAVIER'S UNIVERSE</div>
</div>

<script src="three.min.js"></script>
<script src="app.js"></script>
<div id="bunny"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
 <defs>
  <radialGradient id="bnyBody" cx="38%" cy="30%" r="72%">
   <stop offset="0%" stop-color="#fff8e2" stop-opacity=".60"/>
   <stop offset="46%" stop-color="#ffe3a8" stop-opacity=".25"/>
   <stop offset="82%" stop-color="#ffcf82" stop-opacity=".14"/>
   <stop offset="100%" stop-color="#ffc46e" stop-opacity=".05"/>
  </radialGradient>
  <radialGradient id="bnyHalo" cx="50%" cy="50%" r="50%">
   <stop offset="0%" stop-color="#ffd98c" stop-opacity=".55"/>
   <stop offset="100%" stop-color="#ffcf78" stop-opacity="0"/>
  </radialGradient>
  <filter id="bnyGlow" x="-80%" y="-80%" width="260%" height="260%">
   <feGaussianBlur stdDeviation="2.2" result="b"/>
   <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
 </defs>
 <ellipse cx="32" cy="35" rx="27" ry="25" fill="url(#bnyHalo)" opacity=".75"/>
 <g filter="url(#bnyGlow)" stroke="#ffe9bd" stroke-opacity=".52" stroke-width="1">
  <path d="M23 25 C17 14 18 5 24 4 C29 3.6 29.5 16 28.5 26 Z" fill="url(#bnyBody)"/>
  <path d="M37 24 C39 12 45 6.5 48.5 9.5 C52 13 45.5 20 41 27 Z" fill="url(#bnyBody)"/>
  <ellipse cx="32" cy="38" rx="19.5" ry="18.5" fill="url(#bnyBody)"/>
 </g>
 <path d="M22 23 C20 15 20.5 9 23 7" fill="none" stroke="#fff6dc" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>
 <path d="M40 22 C42 15 45 11 47 11" fill="none" stroke="#fff6dc" stroke-opacity=".45" stroke-width="1.1" stroke-linecap="round"/>
 <g filter="url(#bnyGlow)">
  <circle cx="25.5" cy="37" r="3.1" fill="#ffe9a8" opacity=".55"/>
  <circle cx="25.5" cy="37" r="2.2" fill="#fff7d6"/>
  <circle cx="38.5" cy="37" r="3.1" fill="#ffe9a8" opacity=".55"/>
  <circle cx="38.5" cy="37" r="2.2" fill="#fff7d6"/>
  <circle cx="25.5" cy="37" r="1" fill="#fffdf2"/>
  <circle cx="38.5" cy="37" r="1" fill="#fffdf2"/>
 </g>
 <g filter="url(#bnyGlow)">
  <circle cx="51.4" cy="46.2" r="5.2" fill="url(#bnyBody)" stroke="#ffe9bd" stroke-opacity=".42" stroke-width="1"/>
  <circle cx="50.1" cy="44.5" r="1.5" fill="#fff8e2" opacity=".62"/>
  <circle cx="53.6" cy="48.2" r=".9" fill="#fff1cd" opacity=".40"/>
  <circle cx="49.2" cy="48.6" r=".8" fill="#fff1cd" opacity=".34"/>
 </g>
 <ellipse cx="32" cy="45" rx="4.5" ry="2.4" fill="#fff1cd" opacity=".20"/>
 <path d="M14 34 C12 42 16 51 23 54" fill="none" stroke="#fff3d4" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/>
</svg></div>
<script src="bunny.js"></script>
<style id="xz-addon-style"></style>
<script src="addon.js" id="xz-addon"></script>
  <script src="page-layer.js"></script>
</body>
</html>
